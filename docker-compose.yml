services:
  postgres:
    image: postgres:14-alpine
    container_name: hashtag-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hashtag_tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hashtag_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hashtag-tracker-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      # Override .env values that must differ inside the compose network
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hashtag_tracker
      STORAGE_BASE_PATH: /app/storage
      PORT: 3000
    volumes:
      - app_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  app_storage:
